<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="boxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#06b6d4" flood-opacity="0.15" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Inter:wght@400;600;700&amp;display=swap');

      .mono { font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif; }
      .sans { font-family: 'Inter', -apple-system, sans-serif; }

      /* Animation keyframes (8-second loop) */
      @keyframes typeCommand {
        0%, 5% { opacity: 0; }
        6%, 100% { opacity: 1; }
      }

      @keyframes showTurnstile {
        0%, 18% { opacity: 0; transform: translateY(4px); }
        22%, 100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes showVisionGrid {
        0%, 34% { opacity: 0; transform: translateY(4px); }
        38%, 100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes showThreatScan {
        0%, 50% { opacity: 0; transform: translateY(4px); }
        54%, 100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes showJsonOutput {
        0%, 65% { opacity: 0; transform: translateY(6px); }
        70%, 96% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }

      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }

      .cmd-line { animation: typeCommand 8s infinite; }
      .step-turnstile { animation: showTurnstile 8s infinite; }
      .step-vision { animation: showVisionGrid 8s infinite; }
      .step-threat { animation: showThreatScan 8s infinite; }
      .json-output { animation: showJsonOutput 8s infinite; }
      .cursor { animation: blinkCursor 0.9s infinite; }
      .live-dot { animation: pulseGlow 1.8s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="15" y="15" width="850" height="440" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" filter="url(#boxGlow)" />

  <!-- Terminal Title Bar -->
  <rect x="15" y="15" width="850" height="44" rx="14" fill="url(#headerGrad)" />
  <rect x="15" y="45" width="850" height="14" fill="url(#headerGrad)" />
  <line x1="15" y1="59" x2="865" y2="59" stroke="#334155" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="42" cy="37" r="6" fill="#ef4444" />
  <circle cx="62" cy="37" r="6" fill="#f59e0b" />
  <circle cx="82" cy="37" r="6" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="440" y="41" text-anchor="middle" fill="#94a3b8" class="sans" font-size="12" font-weight="600" letter-spacing="0.5">
    opticparse-cli ~ multimodal vision &amp; threat sentinel v2.4 (edge-anycast)
  </text>

  <!-- Live Edge Pulse Indicator -->
  <circle cx="825" cy="37" r="4.5" fill="#10b981" class="live-dot" />
  <text x="812" y="41" text-anchor="end" fill="#10b981" class="mono" font-size="10" font-weight="600">LIVE</text>

  <!-- Terminal Content Body -->
  <g transform="translate(40, 75)">

    <!-- Command Prompt Line -->
    <g class="cmd-line">
      <text x="0" y="24" fill="#06b6d4" class="mono" font-size="14" font-weight="700">agent@autonomous:~$</text>
      <text x="175" y="24" fill="#f8fafc" class="mono" font-size="14">opticparse scrape</text>
      <text x="325" y="24" fill="#38bdf8" class="mono" font-size="14">"https://store.nvidia.com/h100-cloud"</text>
      <text x="645" y="24" fill="#94a3b8" class="mono" font-size="13">--stealth</text>
      <rect x="725" y="11" width="8" height="16" fill="#38bdf8" class="cursor" />
    </g>

    <!-- Execution Telemetry Steps -->
    <!-- 1. Turnstile / WAF Bypass -->
    <g class="step-turnstile" transform="translate(0, 48)">
      <rect x="0" y="0" width="410" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <circle cx="16" cy="13" r="4" fill="#10b981" />
      <text x="28" y="17" fill="#64748b" class="mono" font-size="12">Anti-Bot &amp; WAF:</text>
      <text x="145" y="17" fill="#34d399" class="mono" font-size="12" font-weight="600">Cloudflare Turnstile Bypassed</text>
      <text x="365" y="17" fill="#64748b" class="mono" font-size="11">[180ms]</text>
    </g>

    <!-- 2. Vision Noise Reduction -->
    <g class="step-vision" transform="translate(425, 48)">
      <rect x="0" y="0" width="395" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <circle cx="16" cy="13" r="4" fill="#06b6d4" />
      <text x="28" y="17" fill="#64748b" class="mono" font-size="12">Vision Grid:</text>
      <text x="120" y="17" fill="#38bdf8" class="mono" font-size="12" font-weight="600">96.4% DOM Noise Purged</text>
      <text x="350" y="17" fill="#64748b" class="mono" font-size="11">[420ms]</text>
    </g>

    <!-- 3. Threat Heuristic Scan -->
    <g class="step-threat" transform="translate(0, 80)">
      <rect x="0" y="0" width="820" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <circle cx="16" cy="13" r="4" fill="#a855f7" />
      <text x="28" y="17" fill="#c084fc" class="mono" font-size="12" font-weight="600">PhishVision Sentinel:</text>
      <text x="195" y="17" fill="#94a3b8" class="mono" font-size="12">Visual Brand Impersonation 0.00 | Drainer Scripts: 0 | Status:</text>
      <text x="690" y="17" fill="#10b981" class="mono" font-size="12" font-weight="700">VERIFIED CLEAN</text>
    </g>

    <!-- JSON Response Container -->
    <g class="json-output" transform="translate(0, 118)">
      <!-- Code Box Background -->
      <rect x="0" y="0" width="820" height="195" rx="8" fill="#070d17" stroke="#1e293b" stroke-width="1.2" />

      <!-- JSON Top Tag -->
      <rect x="12" y="10" width="135" height="18" rx="4" fill="#1e293b" />
      <text x="20" y="23" fill="#38bdf8" class="mono" font-size="10" font-weight="600">OUTPUT: STRUCTURED JSON</text>
      <text x="735" y="23" fill="#10b981" class="mono" font-size="11" font-weight="600">HTTP 200 OK (1.24s)</text>

      <!-- JSON Syntax Highlighting Lines -->
      <text x="24" y="52" fill="#94a3b8" class="mono" font-size="12">{</text>
      
      <text x="44" y="70" fill="#7dd3fc" class="mono" font-size="12">"status"</text>
      <text x="100" y="70" fill="#94a3b8" class="mono" font-size="12">:</text>
      <text x="115" y="70" fill="#34d399" class="mono" font-size="12">"success"</text>
      <text x="180" y="70" fill="#94a3b8" class="mono" font-size="12">,</text>

      <text x="44" y="88" fill="#7dd3fc" class="mono" font-size="12">"cluster"</text>
      <text x="108" y="88" fill="#94a3b8" class="mono" font-size="12">:</text>
      <text x="123" y="88" fill="#fcd34d" class="mono" font-size="12">"NVIDIA H100 80GB SXM5"</text>
      <text x="310" y="88" fill="#94a3b8" class="mono" font-size="12">,</text>

      <text x="44" y="106" fill="#7dd3fc" class="mono" font-size="12">"hourly_rate_usd"</text>
      <text x="180" y="106" fill="#94a3b8" class="mono" font-size="12">:</text>
      <text x="195" y="106" fill="#f87171" class="mono" font-size="12">2.49</text>
      <text x="230" y="106" fill="#94a3b8" class="mono" font-size="12">,</text>

      <text x="44" y="124" fill="#7dd3fc" class="mono" font-size="12">"nodes_available"</text>
      <text x="180" y="124" fill="#94a3b8" class="mono" font-size="12">:</text>
      <text x="195" y="124" fill="#f87171" class="mono" font-size="12">14</text>
      <text x="215" y="124" fill="#94a3b8" class="mono" font-size="12">,</text>

      <text x="44" y="142" fill="#7dd3fc" class="mono" font-size="12">"region_availability"</text>
      <text x="212" y="142" fill="#94a3b8" class="mono" font-size="12">:</text>
      <text x="227" y="142" fill="#94a3b8" class="mono" font-size="12">[</text>
      <text x="237" y="142" fill="#fcd34d" class="mono" font-size="12">"us-east-va"</text>
      <text x="330" y="142" fill="#94a3b8" class="mono" font-size="12">,</text>
      <text x="345" y="142" fill="#fcd34d" class="mono" font-size="12">"eu-central-fra"</text>
      <text x="475" y="142" fill="#94a3b8" class="mono" font-size="12">],</text>

      <text x="44" y="160" fill="#7dd3fc" class="mono" font-size="12">"threat_verified"</text>
      <text x="188" y="160" fill="#94a3b8" class="mono" font-size="12">:</text>
      <text x="203" y="160" fill="#a78bfa" class="mono" font-size="12">true</text>

      <text x="24" y="178" fill="#94a3b8" class="mono" font-size="12">}</text>
    </g>

    <!-- Bottom Footer Call to Action Banner -->
    <g transform="translate(0, 323)">
      <rect x="0" y="0" width="820" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#0ea5e9" stroke-width="1" />
      
      <!-- GitHub Star Incentive -->
      <text x="20" y="23" fill="#fbbf24" class="mono" font-size="13" font-weight="700">★ Star OpticParse on GitHub</text>
      <text x="245" y="23" fill="#64748b" class="sans" font-size="13">|</text>
      
      <!-- Free Credits Incentive -->
      <text x="260" y="23" fill="#f8fafc" class="sans" font-size="12">
        Get <tspan fill="#34d399" font-weight="700">$10 in Free Edge Credits</tspan> on sign up at <tspan fill="#38bdf8" font-weight="600">opticparse.com</tspan>
      </text>

      <!-- Protocol Badges -->
      <rect x="660" y="8" width="65" height="20" rx="4" fill="#0369a1" />
      <text x="692" y="22" text-anchor="middle" fill="#f0f9ff" class="mono" font-size="10" font-weight="700">MCP-V1</text>

      <rect x="735" y="8" width="72" height="20" rx="4" fill="#047857" />
      <text x="771" y="22" text-anchor="middle" fill="#ecfdf5" class="mono" font-size="10" font-weight="700">A2A-LIVE</text>
    </g>

  </g>
</svg>
