name: CI / CD Automated Quality & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-sdks:
    name: Build & Test Public Toolkits
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies & Test Runner
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pydantic langchain-core

      - name: Run SDK Smoke & Integration Tests
        run: |
          pytest tests/test_public_sdks.py -v

      - name: Verify MCP Server Syntax
        run: |
          python -m py_compile mcp_server.py
